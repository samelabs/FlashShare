name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Python syntax
        run: |
          python -m compileall -q app core
          python -m py_compile tests/canonical/*.py tests/ci/*.py tests/support/*.py
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(git ls-files '*.js')
      - name: Source-of-truth guards
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '(/etc/flashshare|/opt/flashshare|(^|[^[:alnum:]_])sudo([^[:alnum:]_]|$))' tests/canonical; then
            echo "canonical tests contain a server-local dependency"
            exit 1
          fi
          tracked_env="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)"
          if [ -n "$tracked_env" ]; then
            echo "tracked environment file(s) are forbidden:"
            printf '%s\n' "$tracked_env"
            exit 1
          fi
      - name: Release metadata contract
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f VERSION ]; then
            echo "VERSION file is missing"
            exit 1
          fi
          version="$(head -n 1 VERSION)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+$'; then
            echo "VERSION must be major.minor, got: $version"
            exit 1
          fi
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "CHANGELOG.md has no release heading for [$version]"
            exit 1
          fi

  canonical:
    name: canonical-integration
    runs-on: ubuntu-latest
    needs: fast
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flashshare
          POSTGRES_PASSWORD: flashshare-ci
          POSTGRES_DB: flashshare_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U flashshare -d flashshare_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql+psycopg://flashshare:flashshare-ci@127.0.0.1:5432/flashshare_ci
      TEST_DB_URL: postgresql://flashshare:flashshare-ci@127.0.0.1:5432/flashshare_ci
      FLASHSHARE_SESSION_SECRET: ci-session-secret-not-production
      FLASHSHARE_GOKAPI_URL: http://127.0.0.1:53898
      FLASHSHARE_GOKAPI_KEY: ci-gokapi-key
      FLASHSHARE_BASE_URL: http://127.0.0.1:8100
      FLASHSHARE_LOG_DIR: /tmp/flashshare-ci-log
      FLASHSHARE_TEST_PORT: "8100"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Fail-closed canonical guard
        shell: bash
        run: |
          set -euo pipefail
          expect_exit_2() {
            set +e
            "$@" >/tmp/guard.out 2>/tmp/guard.err
            code=$?
            set -e
            if [ "$code" -ne 2 ]; then
              echo "expected exit 2, got $code: $*"
              cat /tmp/guard.err
              exit 1
            fi
          }
          expect_exit_2 env -u FLASHSHARE_TEST_PORT -u TEST_DB_URL \
            python tests/canonical/test_invocation_canonical.py
          expect_exit_2 env -u TEST_DB_URL FLASHSHARE_TEST_PORT=8100 \
            python tests/canonical/test_remote_security.py
          expect_exit_2 env FLASHSHARE_TEST_PORT=8000 TEST_DB_URL="$TEST_DB_URL" \
            python tests/canonical/test_invocation_canonical.py
          expect_exit_2 env FLASHSHARE_TEST_PORT=08000 TEST_DB_URL="$TEST_DB_URL" \
            python tests/canonical/test_supply_accept_multi.py
          expect_exit_2 env -u TEST_DB_URL FLASHSHARE_TEST_PORT=8100 \
            python tests/canonical/test_supply_accept_multi.py
          expect_exit_2 env -u TEST_DB_URL FLASHSHARE_TEST_PORT=8100 \
            python tests/canonical/test_architecture_unification.py
          expect_exit_2 env FLASHSHARE_TEST_PORT=8000 TEST_DB_URL="$TEST_DB_URL" \
            python tests/canonical/test_architecture_unification.py
          expect_exit_2 env -u TEST_DB_URL FLASHSHARE_TEST_PORT=8100 \
            python tests/canonical/test_ingress_entitlement.py
          expect_exit_2 env -u TEST_DB_URL FLASHSHARE_TEST_PORT=8100 \
            python tests/canonical/test_access_projection.py
          expect_exit_2 env -u TEST_DB_URL FLASHSHARE_TEST_PORT=8100 \
            python tests/canonical/test_membership_reconcile.py
          expect_exit_2 env -u TEST_DB_URL FLASHSHARE_TEST_PORT=8100 \
            python tests/canonical/test_membership_governance.py
          expect_exit_2 env -u TEST_DB_URL FLASHSHARE_TEST_PORT=8100 \
            python tests/canonical/test_payment_tiers.py
          expect_exit_2 env -u TEST_DB_URL FLASHSHARE_TEST_PORT=8100 \
            python tests/canonical/test_plan_catalog.py
          expect_exit_2 env -u TEST_DB_URL FLASHSHARE_TEST_PORT=8100 \
            python tests/canonical/test_tier_invariants.py
          expect_exit_2 env -u TEST_DB_URL FLASHSHARE_TEST_PORT=8100 \
            python tests/canonical/test_topup_route_contract.py
          expect_exit_2 env FLASHSHARE_TEST_PORT=8000 TEST_DB_URL="$TEST_DB_URL" \
            python tests/canonical/test_topup_route_contract.py
          expect_exit_2 env -u TEST_DB_URL FLASHSHARE_TEST_PORT=8100 \
            python tests/canonical/test_economy_core.py
          expect_exit_2 env FLASHSHARE_TEST_PORT=8000 TEST_DB_URL="$TEST_DB_URL" \
            python tests/canonical/test_economy_core.py
          expect_exit_2 env -u TEST_DB_URL FLASHSHARE_TEST_PORT=8100 \
            python tests/canonical/test_payment_forward.py
          expect_exit_2 env -u TEST_DB_URL FLASHSHARE_TEST_PORT=8100 \
            python tests/canonical/test_payment_reverse.py
          expect_exit_2 env FLASHSHARE_TEST_PORT=8000 TEST_DB_URL="$TEST_DB_URL" \
            python tests/canonical/test_payment_forward.py
          expect_exit_2 env FLASHSHARE_TEST_PORT=8000 TEST_DB_URL="$TEST_DB_URL" \
            python tests/canonical/test_payment_reverse.py
          expect_exit_2 env -u TEST_DB_URL FLASHSHARE_TEST_PORT=8100 \
            python tests/canonical/test_operator_audit.py
          expect_exit_2 env FLASHSHARE_TEST_PORT=8000 TEST_DB_URL="$TEST_DB_URL" \
            python tests/canonical/test_operator_audit.py
          expect_exit_2 env -u TEST_DB_URL FLASHSHARE_TEST_PORT=8100 \
            python tests/canonical/test_execution_boundaries.py
          expect_exit_2 env FLASHSHARE_TEST_PORT=8000 TEST_DB_URL="$TEST_DB_URL" \
            python tests/canonical/test_execution_boundaries.py
          expect_exit_2 env -u TEST_DB_URL FLASHSHARE_TEST_PORT=8100 \
            python tests/canonical/test_state_schema_invariants.py
          expect_exit_2 env FLASHSHARE_TEST_PORT=8000 TEST_DB_URL="$TEST_DB_URL" \
            python tests/canonical/test_state_schema_invariants.py
          expect_exit_2 env -u TEST_DB_URL FLASHSHARE_TEST_PORT=8100 \
            python tests/canonical/test_result_settlement_atomicity.py
          expect_exit_2 env FLASHSHARE_TEST_PORT=8000 TEST_DB_URL="$TEST_DB_URL" \
            python tests/canonical/test_result_settlement_atomicity.py
          expect_exit_2 env -u TEST_DB_URL FLASHSHARE_TEST_PORT=8100 \
            python tests/canonical/test_ingress_idempotency.py
          expect_exit_2 env FLASHSHARE_TEST_PORT=8000 TEST_DB_URL="$TEST_DB_URL" \
            python tests/canonical/test_ingress_idempotency.py
          expect_exit_2 env -u TEST_DB_URL FLASHSHARE_TEST_PORT=8100 \
            python tests/canonical/test_order_payment_state_machine.py
          expect_exit_2 env FLASHSHARE_TEST_PORT=8000 TEST_DB_URL="$TEST_DB_URL" \
            python tests/canonical/test_order_payment_state_machine.py
          expect_exit_2 env -u TEST_DB_URL FLASHSHARE_TEST_PORT=8100 \
            python tests/canonical/test_order_payment_state.py
          expect_exit_2 env FLASHSHARE_TEST_PORT=8000 TEST_DB_URL="$TEST_DB_URL" \
            python tests/canonical/test_order_payment_state.py
          expect_exit_2 env -u TEST_DB_URL FLASHSHARE_TEST_PORT=8100 \
            python tests/canonical/test_operation_identity.py
          expect_exit_2 env FLASHSHARE_TEST_PORT=8000 TEST_DB_URL="$TEST_DB_URL" \
            python tests/canonical/test_operation_identity.py
          expect_exit_2 env -u TEST_DB_URL FLASHSHARE_TEST_PORT=8100 \
            python tests/canonical/test_commission_effective_time.py
          expect_exit_2 env FLASHSHARE_TEST_PORT=8000 TEST_DB_URL="$TEST_DB_URL" \
            python tests/canonical/test_commission_effective_time.py
          expect_exit_2 env -u TEST_DB_URL FLASHSHARE_TEST_PORT=8100 \
            python tests/canonical/test_plan_mirror_commit_outcome.py
          expect_exit_2 env FLASHSHARE_TEST_PORT=8000 TEST_DB_URL="$TEST_DB_URL" \
            python tests/canonical/test_plan_mirror_commit_outcome.py
          # semantic guards (do not replace behavior tests):
          # orchestrator is staging-only and holds no source-deletion
          # authority; finalize_call_ok is the single tool_calls.upload_id
          # writer (staged-result cleanup lives in gate.py only)
          test -z "$(grep -n save_upload_record core/execution/orchestrator.py)"
          test -z "$(grep -n delete_gokapi_file core/execution/orchestrator.py)"
          # operation identity: no server-generated ref, no null-ref semantics,
          # no null ref in production JS, MCP requires client_ref
          test -z "$(grep -n 'secrets' core/execution/gate.py)"
          test "$(grep -c 'client_ref: *null' static/app.js)" = "0"
          grep -q 'required = \["files", "client_ref"\]' app/routes/mcp.py
          # Public REST v1 retired: apiv1 module must stay absent
          test ! -e app/routes/apiv1.py
          # payment identity/precedence guards (behavior tests are the authority)
          grep -q 'checkout_request_id_invalid' app/routes/topup.py
          test "$(grep -rn 'UPDATE orders SET' app/ core/ --include=*.py | grep -v 'repo/orders.py' | wc -l)" = "0"
          test -z "$(grep -A8 'create_credits_checkout(order' app/routes/topup.py | grep mark_failed)"
          grep -q 'order_id_from_request_id' app/routes/topup.py
          test -z "$(grep -n 'client_ref' app/routes/topup.py static/pages/credits.js || true)"
          test "$(grep -rn "SET status='ok'" core/repo/ledger.py | wc -l)" = "1"
          python3 -c "s=open('core/execution/gate.py').read(); b=s.split('def _finish')[1].split(chr(10)+'def ')[0]; assert 'commission_rate()' not in b.replace('commission_rate_snapshot',''), '_finish must not read current commission config'"
          python tests/canonical/test_rounded_corners.py

      - name: Start Gokapi HTTP-boundary service
        shell: bash
        run: |
          set -euo pipefail
          python tests/support/fake_gokapi.py \
            --host 127.0.0.1 --port 53898 --key "$FLASHSHARE_GOKAPI_KEY" \
            >/tmp/fake-gokapi.log 2>&1 &
          echo $! >/tmp/fake-gokapi.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:53898/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fake-gokapi.log
          exit 1

      - name: Gokapi adapter contract
        run: python tests/ci/test_gokapi_adapter.py

      - name: Gokapi capability probe contract
        run: python tests/ci/test_gokapi_capability_probe.py

      - name: Runtime identity contract (healthz source_sha/dirty)
        run: python tests/ci/test_healthz_identity.py

      - name: Web flow JS behavior contract
        run: node tests/ci/test_web_flow_contract.js

      - name: UI error/retry JS contract
        run: node tests/ci/test_ui_error_contract.js

      - name: PWA download JS contract
        run: node tests/ci/test_pwa_download_contract.js

      - name: Result image rule JS contract
        run: node tests/ci/test_result_image_rule_contract.js

      - name: Start real FlashShare app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$FLASHSHARE_LOG_DIR"
          python -m uvicorn app.main:app \
            --host 127.0.0.1 --port 8100 --workers 1 \
            >/tmp/flashshare-app.log 2>&1 &
          echo $! >/tmp/flashshare-app.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8100/healthz >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/flashshare-app.pid)" 2>/dev/null; then
              cat /tmp/flashshare-app.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/flashshare-app.log
          exit 1

      - name: Stage C canonical
        run: python tests/canonical/test_invocation_canonical.py

      - name: Supply accept/multi canonical
        run: python tests/canonical/test_supply_accept_multi.py
      - name: Architecture unification canonical
        run: python tests/canonical/test_architecture_unification.py

      - name: Remote security canonical
        run: python tests/canonical/test_remote_security.py

      - name: Ingress entitlement canonical
        run: python tests/canonical/test_ingress_entitlement.py

      - name: Access projection canonical
        run: python tests/canonical/test_access_projection.py

      - name: Membership reconcile canonical
        run: python tests/canonical/test_membership_reconcile.py

      - name: Membership governance canonical
        run: python tests/canonical/test_membership_governance.py

      - name: Payment tiers canonical
        run: python tests/canonical/test_payment_tiers.py

      - name: Plan catalog canonical
        run: python tests/canonical/test_plan_catalog.py

      - name: Tier invariants canonical
        run: python tests/canonical/test_tier_invariants.py

      - name: Topup route contract canonical
        run: python tests/canonical/test_topup_route_contract.py

      - name: Economy core canonical
        run: python tests/canonical/test_economy_core.py

      - name: Payment forward canonical
        run: python tests/canonical/test_payment_forward.py

      - name: Payment reverse canonical
        run: python tests/canonical/test_payment_reverse.py

      - name: Operator audit canonical
        run: python tests/canonical/test_operator_audit.py

      - name: Execution boundaries canonical
        run: python tests/canonical/test_execution_boundaries.py

      - name: State schema invariants canonical
        run: python tests/canonical/test_state_schema_invariants.py

      - name: Result settlement atomicity canonical
        run: python tests/canonical/test_result_settlement_atomicity.py

      - name: Commission effective-time canonical
        run: python tests/canonical/test_commission_effective_time.py

      - name: Operation identity canonical
        run: python tests/canonical/test_operation_identity.py

      - name: Order payment state machine canonical
        run: python tests/canonical/test_order_payment_state_machine.py

      - name: Plan mirror commit-outcome canonical
        run: python tests/canonical/test_plan_mirror_commit_outcome.py

      - name: Order payment state canonical
        run: python tests/canonical/test_order_payment_state.py

      - name: Ingress idempotency canonical
        run: python tests/canonical/test_ingress_idempotency.py

      - name: Failure diagnostics
        if: failure()
        shell: bash
        run: |
          echo "=== FlashShare app log ==="
          cat /tmp/flashshare-app.log 2>/dev/null || true
          echo "=== fake Gokapi log ==="
          cat /tmp/fake-gokapi.log 2>/dev/null || true
          echo "=== PostgreSQL service ==="
          docker logs "${{ job.services.postgres.id }}" 2>&1 | tail -200 || true
