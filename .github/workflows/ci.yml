          expect_exit_2 env FLASHSHARE_TEST_PORT=8000 TEST_DB_URL="$TEST_DB_URL" \
            python tests/canonical/test_identity_closure.py
          # semantic guards (do not replace behavior tests):
          # orchestrator is staging-only and holds no source-deletion
          # authority; finalize_call_ok is the single tool_calls.upload_id
          # writer (staged-result cleanup lives in gate.py only)
          test -z "$(grep -n save_upload_record core/execution/orchestrator.py)"
          test -z "$(grep -n delete_gokapi_file core/execution/orchestrator.py)"
          # operation identity: no server-generated ref, no null-ref semantics,
          # no null ref in production JS, MCP requires client_ref
          # (IO-1: files is optional — 0-file tools are legal; the files
          #  entry shape is validated separately)
          test -z "$(grep -n 'secrets' core/execution/gate.py)"
          test "$(grep -c 'client_ref: *null' static/app.js)" = "0"
          grep -q 'required = \["client_ref"\]' app/routes/mcp.py
          # Public REST v1 retired: apiv1 module must stay absent
          test ! -e app/routes/apiv1.py
          # payment identity/precedence guards (behavior tests are the authority)
          grep -q 'checkout_request_id_invalid' app/routes/topup.py
          test "$(grep -rn 'UPDATE orders SET' app/ core/ --include=*.py | grep -v 'repo/orders.py' | wc -l)" = "0"
          test -z "$(grep -A8 'create_credits_checkout(order' app/routes/topup.py | grep mark_failed)"
          grep -q 'order_id_from_request_id' app/routes/topup.py
          test -z "$(grep -n 'client_ref' app/routes/topup.py static/pages/credits.js || true)"
          test "$(grep -rn "SET status='ok'" core/repo/ledger.py | wc -l)" = "1"
          python3 -c "s=open('core/execution/gate.py').read(); b=s.split('def _finish')[1].split(chr(10)+'def ')[0]; assert 'commission_rate()' not in b.replace('commission_rate_snapshot',''), '_finish must not read current commission config'"
          # Jinja dict safety: texts.<dict-method-name> attribute access
          # resolves to the METHOD (empty render) — keys must use ['key'].
          # texts.get(...) CALLS are legitimate and allowed.
          test -z "$(grep -rP "texts\.(copy|items|keys|values|get|update|pop|clear|fromkeys|setdefault|popitem)(?![\w(])" app/templates || true)"
          # X identity closure: avatar authority is users.avatar_url only;
          # zero runtime references to the retired x_avatar_url field
          test -z "$(grep -rn 'x_avatar_url' core/ app/ static/ --include='*.py' --include='*.js' --include='*.html')"

