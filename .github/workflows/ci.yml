          expect_exit_2 env -u FLASHSHARE_TEST_PORT -u TEST_DB_URL \
            python tests/canonical/test_invocation_canonical.py
          expect_exit_2 env -u TEST_DB_URL FLASHSHARE_TEST_PORT=8100 \
            python tests/canonical/test_x_identity_avatar.py
