<!doctype html>
<html lang="{{ locale }}" dir="{{ direction }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1419">
  <meta name="author" content="518.PLUS">
  <meta property="og:site_name" content="{{ APP_NAME }}">
  <meta property="og:locale" content="{{ locale }}">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="/static/images/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <title>{% block title %}{{ APP_NAME }}{% endblock %}</title>
  <meta name="description" content="{% block desc %}{{ texts.subtitle }}{% endblock %}">
  {% block meta %}{% endblock %}
  <style>{{ CSS|safe }}</style>
</head>
<body>
  <main class="shell {{ shell_class }}">
    {% include "partials/header.html" %}

    {% block content %}{% endblock %}
  </main>

  {% block modals %}
  <div class="modal hidden" id="historyModal" role="dialog" aria-modal="true" aria-label="Recent uploads">
    <div class="modal-panel history-panel">
      <button class="modal-close" id="historyModalClose" type="button" aria-label="Close">{{ close_icon }}</button>
      <h2 data-i18n="recent">Recent</h2>
      <span class="history-count" id="historyCount"></span>
      <div id="historyList" class="history-list" data-empty=""></div>
    </div>
  </div>
  {% endblock %}

  <script>
    {% block script_head %}{% endblock %}
    {% block script %}{% endblock %}
    {% block script_tail %}{% endblock %}
  </script>

  {% include "partials/footer.html" %}
</body>
</html>
