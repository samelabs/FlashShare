{% extends "samelabs/base_samelabs.html" %}
{% set page_title = "积分包" %}
{% block body %}

<div class="sl-panel">
  <div class="sl-panel-head">
    <h2>积分包</h2>
    <span class="sl-panel-sub">价格单位: 分</span>
  </div>
  <div class="sl-tablewrap">
    <table class="sl-tbl">
      <thead><tr><th>code</th><th>名称</th><th class="sl-num">积分</th><th class="sl-num">价格(分)</th><th>状态</th><th></th></tr></thead>
      <tbody>
      {% for p in packages %}
        <tr data-pkg="{{ p.id }}">
          <td class="sl-mono">{{ p.code|e }}</td>
          <td><input class="sl-input" style="width:110px" type="text" value="{{ p.name|e }}" data-field="name" maxlength="64"></td>
          <td class="sl-num"><input class="sl-input" style="width:90px" type="number" min="1" value="{{ p.credits }}" data-field="credits"></td>
          <td class="sl-num"><input class="sl-input" style="width:90px" type="number" min="0" value="{{ p.price_cents }}" data-field="price_cents"></td>
          <td>
            {% if p.active %}<span class="sl-badge sl-b-ok">生效中</span>
            {% else %}<span class="sl-badge sl-b-muted">停用</span>{% endif %}
            <button type="button" class="sl-btn pkg-toggle" data-pkg="{{ p.id }}" data-active="{{ 1 if p.active else 0 }}">{{ "下架" if p.active else "上架" }}</button>
          </td>
          <td><button type="button" class="sl-btn sl-btn-primary pkg-save" data-pkg="{{ p.id }}">保存</button></td>
        </tr>
      {% else %}
        <tr><td colspan="6" class="sl-dim">暂无积分包</td></tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
  <form class="sl-form" id="pkgForm">
    <input class="sl-input" type="text" id="pkgCode" placeholder="code 如 pack500" maxlength="32" required>
    <input class="sl-input" type="text" id="pkgName" placeholder="名称" maxlength="64" required>
    <input class="sl-input" type="number" id="pkgCredits" placeholder="积分" min="1" style="flex:0 1 110px" required>
    <input class="sl-input" type="number" id="pkgPrice" placeholder="价格(分)" min="0" style="flex:0 1 110px" required>
    <button type="submit" class="sl-btn sl-btn-primary" id="pkgCreate">创建积分包</button>
  </form>
</div>

{% endblock %}

{% block script %}<script src="/static/pages/samelabs_packages.js?v={{ pages_version }}"></script>{% endblock %}
