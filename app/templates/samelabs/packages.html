{% extends "samelabs/base_samelabs.html" %}
{% set page_title = "积分包" %}
{% block body %}

<div class="sl-panel">
  <div class="sl-panel-head">
    <h2>积分包</h2>
    <span class="sl-panel-sub">点击积分包配置数值与上下架</span>
  </div>
  <div class="tier-list">
    {% for p in packages %}
    <button type="button" class="tier-card" data-pkg="{{ p.id }}">
      <div class="tier-card-main">
        <span class="tier-card-name">{{ p.name|e }}</span>
        <span class="tier-card-code sl-mono sl-dim">{{ p.code|e }}</span>
      </div>
      <div class="tier-card-facts">
        <span class="tier-fact">{{ '+' ~ p.credits ~ ' 积分' }}</span>
        <span class="tier-fact{% if not p.price_cents %} miss{% endif %}">{{ '$' ~ '%.0f'|format(p.price_cents / 100) if p.price_cents else '未定价' }}</span>
      </div>
      {% if p.active %}<span class="sl-badge sl-b-ok tier-card-state">生效中</span>
      {% else %}<span class="sl-badge sl-b-muted tier-card-state">已停用</span>{% endif %}
    </button>
    {% else %}
    <p class="sl-dim" style="padding:16px">暂无积分包</p>
    {% endfor %}
  </div>
</div>

<div class="sl-panel">
  <div class="sl-panel-head">
    <h2>新建积分包</h2>
    <span class="sl-panel-sub">code 创建后不可改</span>
  </div>
  <div class="tier-list">
    <button type="button" class="tier-card tier-card-add" id="pkgAdd">
      <span class="tier-card-main">＋ 新建积分包</span>
      <span class="tier-card-facts"><span class="tier-fact sl-dim">定义 code、积分与价格</span></span>
    </button>
  </div>
</div>

<div class="modal hidden" id="pkgModal">
  <div class="modal-panel tier-editor">
    <div class="tier-editor-head">
      <h3 id="pkgEditorTitle">积分包配置</h3>
      <span class="sl-badge sl-b-muted sl-mono" id="pkgEditorCode"></span>
      <button type="button" class="modal-close-btn" id="pkgModalClose" aria-label="关闭">✕</button>
    </div>
    <div class="tier-editor-body">
      <div class="tier-fgroup">
        <div class="tier-fgroup-title">商品</div>
        <label class="tier-field tier-field-create"><span>code (不可改)</span><input class="sl-input sl-mono" type="text" id="g_code" maxlength="32" placeholder="如 pack500"></label>
        <label class="tier-field"><span>名称</span><input class="sl-input" type="text" id="g_name" maxlength="64"></label>
        <label class="tier-field"><span>积分</span><input class="sl-input" type="number" min="1" id="g_credits"></label>
        <label class="tier-field"><span>价格 (分)</span><input class="sl-input" type="number" min="0" id="g_price_cents"></label>
        <label class="tier-field tier-field-inline"><span>上架销售</span><input type="checkbox" id="g_active"></label>
      </div>
    </div>
    <div class="tier-editor-foot">
      <span class="sl-dim"></span>
      <button type="button" class="sl-btn sl-btn-primary" id="pkgSave">保存</button>
    </div>
  </div>
</div>

{% endblock %}

{% block script %}
<script>window.__SL_PKGS__ = {{ packages|tojson }};</script>
<script src="/static/pages/samelabs_packages.js?v={{ pages_version }}"></script>
{% endblock %}
