<!DOCTYPE html>
<html lang="{{ locale }}" dir="{{ direction }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{ t.print_btn }} · {{ file_name }}</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f2f4f7; color: #1a1d21;
    display: flex; flex-direction: column; height: 100vh; height: 100dvh;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: #fff; border-bottom: 1px solid #e2e6eb;
    flex: none;
  }
  header .name {
    flex: 1; min-width: 0; font-size: 14px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 18px; border-radius: 8px; border: 1px solid #d5dae1;
    background: #fff; color: #1a1d21; font-size: 14px; font-weight: 600;
    cursor: pointer; text-decoration: none; flex: none;
  }
  .btn.primary { background: #1652f0; border-color: #1652f0; color: #fff; }
  .btn[disabled] { opacity: 0.55; cursor: default; pointer-events: none; }
  main { flex: 1; min-height: 0; padding: 12px; position: relative; }
  iframe { width: 100%; height: 100%; border: 0; border-radius: 10px; background: #fff; }
  #pages {
    display: none; /* becomes flex once PDF.js renders */
    flex-direction: column; align-items: center; gap: 12px;
    height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  #pages canvas { max-width: 100%; background: #fff; border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,.18); }
  .page-slot { display: flex; justify-content: center; width: 100%; }
  .status {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    color: #66707a; font-size: 14px; text-align: center; padding: 0 24px;
  }
  .spin {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid #d5dae1; border-top-color: #1652f0;
    animation: r 0.9s linear infinite;
  }
  @keyframes r { to { transform: rotate(360deg); } }
  p.hint { padding: 8px 16px 12px; font-size: 12px; color: #66707a; flex: none; }
  @media print {
    header, p.hint, .status { display: none !important; }
    main { padding: 0; }
    body { background: #fff; height: auto; }
    #pages { display: flex !important; height: auto; overflow: visible; gap: 0; }
    .page-slot { page-break-after: always; break-after: page; }
    .page-slot:last-child { page-break-after: auto; break-after: auto; }
    #pages canvas { max-width: none; box-shadow: none; border-radius: 0; }
    iframe { display: none !important; }
  }
</style>
</head>
<body>
<header>
  <span class="name">{{ file_name }}</span>
  <a class="btn" href="{{ download_url }}">{{ t.download_file if t.download_file else "Download" }}</a>
  <button class="btn primary" type="button" id="printBtn" disabled>{{ t.print_btn }}</button>
</header>
<main>
  <iframe id="pdfFrame" src="{{ inline_url }}" title="{{ file_name }}"></iframe>
  <div id="pages" aria-hidden="true"></div>
  <div class="status" id="status"><div class="spin"></div><span id="statusText">{{ t.print_loading }}</span></div>
</main>
<p class="hint">{{ t.print_hint }}</p>
<script type="module" src="/static/pages/print.js?v={{ pages_version }}"></script>
</body>
</html>
