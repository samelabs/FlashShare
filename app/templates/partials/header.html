{# shared_header: brand + auth controls + language switch #}
<header class="topbar">
  <a class="brand" href="/" aria-label="518.PLUS">
    <span class="brand-logo">518.PLUS</span><svg class="brand-verified" width="16" height="16" viewBox="0 0 24 24" fill="#FFB800" aria-hidden="true"><path d="M22.5 12.5c0-1.58-.875-2.95-2.148-3.6.154-.435.238-.905.238-1.4 0-2.21-1.71-3.998-3.818-3.998-.47 0-.92.084-1.336.25C14.818 2.415 13.51 1.5 12 1.5s-2.816.917-3.437 2.25c-.415-.165-.866-.25-1.336-.25-2.11 0-3.818 1.79-3.818 4 0 .494.083.964.237 1.4-1.272.65-2.147 2.018-2.147 3.6 0 1.495.782 2.798 1.942 3.486-.02.17-.032.34-.032.514 0 2.21 1.708 4 3.818 4 .47 0 .92-.086 1.335-.25.62 1.334 1.926 2.25 3.437 2.25 1.512 0 2.818-.916 3.437-2.25.415.163.865.248 1.336.248 2.11 0 3.818-1.79 3.818-4 0-.174-.012-.344-.033-.514 1.16-.687 1.943-1.99 1.943-3.484zm-6.616-3.334l-4.334 6.5c-.145.217-.382.334-.625.334-.143 0-.288-.04-.416-.126l-.115-.094-2.415-2.415c-.293-.293-.293-.768 0-1.06s.768-.294 1.06 0l1.77 1.767 3.825-5.74c.23-.345.696-.436 1.04-.207.346.23.44.696.21 1.04z"></path></svg>
  </a>
  <div class="top-actions">
    {% if user %}
    <div class="user-menu">
      <button class="topbar-profile" id="userMenuBtn" type="button" aria-haspopup="true" aria-expanded="false">
        {{ (user.displayName or user.username or '?')|e }}
      </button>
      <div class="user-dropdown hidden" id="userDropdown" role="menu">
        <div class="user-info">
          <span class="user-name">{{ (user.displayName or user.username)|e }} <span class="user-handle">@{{ user.username|e }}</span></span>
        </div>
        <a href="/auth/profile" role="menuitem" data-i18n="settings">{{ icon_svg("settings") }}<span>{{ texts.settings }}</span></a>
        <form method="post" action="/auth/logout">
          <button type="submit" class="logout-link" data-i18n="logout">{{ icon_svg("logout") }}<span>{{ texts.logout }}</span></button>
        </form>
      </div>
    </div>
    {% else %}
    <a class="topbar-login" href="/auth/login" data-i18n="signIn">{{ texts.signIn }}</a>
    <a class="topbar-register" href="/auth/register" data-i18n="signUp">{{ texts.signUp }}</a>
    {% endif %}
    {% if user %}
    <button class="nav-icon" id="historyBtn" type="button" aria-label="{{ texts.recent }}">{{ history_icon_svg }}</button>
    {% endif %}
    <div class="lang-switch" id="langSwitch">
      <button class="lang-button" id="langButton" type="button" aria-haspopup="listbox" aria-expanded="false"></button>
      <div class="lang-menu hidden" id="langMenu" role="listbox" aria-label="Language"></div>
    </div>
  </div>
</header>
