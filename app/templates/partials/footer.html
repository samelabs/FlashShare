{# shared_footer: copyright + language switcher JS #}
<footer class="site-footer">
  <div class="footer-inner">
    <span class="footer-copy">© {{ year }} <strong class="brand-logo">518<span class="brand-dot">.</span>PLUS</strong></span>
  </div>
</footer>
<script>
// User dropdown menu (shared across all pages)
(function(){var b=document.getElementById("userMenuBtn"),d=document.getElementById("userDropdown");if(b&&d){b.addEventListener("click",function(e){e.stopPropagation();var h=d.classList.toggle("hidden");b.setAttribute("aria-expanded",h?"false":"true")});document.addEventListener("click",function(e){if(e.target===b||d.contains(e.target))return;d.classList.add("hidden");b.setAttribute("aria-expanded","false")})}})();
// History modal (shared across all pages)
(function(){var b=document.getElementById("historyBtn"),m=document.getElementById("historyModal"),c=document.getElementById("historyModalClose"),l=document.getElementById("historyList");if(b&&m){b.addEventListener("click",function(){m.classList.remove("hidden");if(typeof loadHistory==="function"){loadHistory()}else if(l){l.innerHTML="";fetch("/api/uploads").then(function(r){return r.json()}).then(function(d){if(d&&d.uploads&&d.uploads.length){l.setAttribute("data-empty","");d.uploads.forEach(function(x,i){var share="https://x.com/intent/tweet?"+new URLSearchParams({text:"518.PLUS",url:x.url_download});l.insertAdjacentHTML("beforeend",'<div class="item"><a class="item-link" href="'+x.url_download+'"><span class="item-main"><span class="item-title"><span class="item-name">'+x.file_name+'</span></span><span class="item-sub">'+x.size_bytes+' bytes</span></span></a><div class="item-actions"><a class="item-tool accent-action" href="'+share+'" target="_blank" rel="noreferrer">𝕏</a></div></div>')})}else{l.setAttribute("data-empty","No files")}})}});if(c)c.addEventListener("click",function(){m.classList.add("hidden")});m.addEventListener("click",function(e){if(e.target===m)m.classList.add("hidden")})}})();
// Language switch (shared across all pages)
(function(){
if(window.__LANG_INIT__)return;window.__LANG_INIT__=true;var SUPPORTED_LANGS=["en","zh","ja","ko","es","ar","de","ru","pt","fr"];var LANG_LABELS={"en":"English","zh":"简体中文","ja":"日本語","ko":"한국어","es":"Español","ar":"العربية","de":"Deutsch","ru":"Русский","pt":"Português","fr":"Français"};var currentLang="{{ lang }}";var langButton=document.getElementById("langButton");var langMenu=document.getElementById("langMenu");if(langButton&&langMenu){langButton.textContent=LANG_LABELS[currentLang]||"English";langMenu.innerHTML=SUPPORTED_LANGS.map(c=>`<button class="lang-option${c===currentLang?" active":""}" type="button" role="option" aria-selected="${c===currentLang}" data-lang="${c}">${LANG_LABELS[c]}</button>`).join("");langButton.addEventListener("click",()=>{const h=langMenu.classList.toggle("hidden");langButton.setAttribute("aria-expanded",h?"false":"true")});langMenu.addEventListener("click",e=>{const o=e.target.closest("[data-lang]");if(!o)return;const lang=SUPPORTED_LANGS.includes(o.dataset.lang)?o.dataset.lang:"en";document.cookie="flashshare_lang="+lang+";Path=/;Max-Age=31536000;SameSite=Lax";location.reload()});document.addEventListener("click",e=>{if(e.target===langButton||langMenu.contains(e.target))return;langMenu.classList.add("hidden");langButton.setAttribute("aria-expanded","false")})}
})();
</script>
