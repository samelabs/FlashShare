{# shared_footer: copyright + language switcher JS #}
<footer class="site-footer">
  <div class="footer-inner">
    <span class="footer-copy">© {{ year }} <strong class="brand-logo">518<span class="brand-dot">.</span>PLUS</strong></span>
  </div>
</footer>
<script>
// User dropdown menu (shared across all pages)
(function(){var b=document.getElementById("userMenuBtn"),d=document.getElementById("userDropdown");if(b&&d){b.addEventListener("click",function(e){e.stopPropagation();var h=d.classList.toggle("hidden");b.setAttribute("aria-expanded",h?"false":"true")});document.addEventListener("click",function(e){if(e.target===b||d.contains(e.target))return;d.classList.add("hidden");b.setAttribute("aria-expanded","false")})}})();
// History modal (shared across all pages)
(function(){var b=document.getElementById("historyBtn"),m=document.getElementById("historyModal"),c=document.getElementById("historyModalClose"),l=document.getElementById("historyList"),hc=document.getElementById("historyCount");function _del(pid,btn){if(!confirm("Delete?"))return;fetch("/api/uploads/"+pid,{method:"DELETE"}).then(function(r){return r.json()}).then(function(d){if(d.ok){var item=btn.closest(".item");if(item)item.remove();var n=l.querySelectorAll(".item").length;if(hc)hc.textContent=n||"";if(!n)l.setAttribute("data-empty","—")}})}function _fmt(b){if(b<1024)return b+"B";if(b<1048576)return Math.ceil(b/1024)+"KB";return(b/1048576).toFixed(1)+"MB"}window._loadHistory=function(){if(!l)return;l.innerHTML="";l.setAttribute("data-empty","");fetch("/api/uploads").then(function(r){return r.json()}).then(function(d){if(!d||!d.uploads||!d.uploads.length){l.setAttribute("data-empty","—");if(hc)hc.textContent="";return}var n=d.uploads.length;if(hc)hc.textContent=String(n);d.uploads.forEach(function(x){var s="/f/"+x.public_id;var sh="https://x.com/intent/tweet?"+new URLSearchParams({text:"518.PLUS",url:location.origin+s});var dl=s+"?download=1";var ic=x.content_type&&x.content_type.indexOf("image")>=0?'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>':'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>';l.insertAdjacentHTML("beforeend",'<div class="item"><a class="item-link" href="'+s+'"><span class="item-main"><span class="item-title"><span class="fmt-badge">'+ic+'</span><span class="item-name">'+x.file_name+'</span></span><span class="item-sub">'+_fmt(x.size_bytes)+'</span></span></a><div class="item-actions"><button class="item-tool" data-dl="'+dl+'"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button><button class="item-tool" data-cp="'+s+'"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button><a class="item-tool accent-action" href="'+sh+'" target="_blank" rel="noreferrer">𝕏</a><button class="item-tool danger-action" data-del="'+x.public_id+'">✕</button></div></div>')});l.querySelectorAll("[data-dl]").forEach(function(btn){btn.addEventListener("click",function(){window.location.href=btn.dataset.dl})});l.querySelectorAll("[data-cp]").forEach(function(btn){btn.addEventListener("click",function(){navigator.clipboard.writeText(location.origin+btn.dataset.cp).then(function(){btn.style.color="var(--accent)";setTimeout(function(){btn.style.color=""},1500)})})});l.querySelectorAll("[data-del]").forEach(function(btn){btn.addEventListener("click",function(){_del(btn.dataset.del,btn)})})})};if(b&&m){b.addEventListener("click",function(){m.classList.remove("hidden");window._loadHistory()});if(c)c.addEventListener("click",function(){m.classList.add("hidden")});m.addEventListener("click",function(e){if(e.target===m)m.classList.add("hidden")})}})();
// Language switch (shared across all pages)
(function(){
if(window.__LANG_INIT__)return;window.__LANG_INIT__=true;var SUPPORTED_LANGS=["en","zh","ja","ko","es","ar","de","ru","pt","fr"];var LANG_LABELS={"en":"English","zh":"简体中文","ja":"日本語","ko":"한국어","es":"Español","ar":"العربية","de":"Deutsch","ru":"Русский","pt":"Português","fr":"Français"};var currentLang="{{ lang }}";var langButton=document.getElementById("langButton");var langMenu=document.getElementById("langMenu");if(langButton&&langMenu){langButton.textContent=LANG_LABELS[currentLang]||"English";langMenu.innerHTML=SUPPORTED_LANGS.map(c=>`<button class="lang-option${c===currentLang?" active":""}" type="button" role="option" aria-selected="${c===currentLang}" data-lang="${c}">${LANG_LABELS[c]}</button>`).join("");langButton.addEventListener("click",()=>{const h=langMenu.classList.toggle("hidden");langButton.setAttribute("aria-expanded",h?"false":"true")});langMenu.addEventListener("click",e=>{const o=e.target.closest("[data-lang]");if(!o)return;const lang=SUPPORTED_LANGS.includes(o.dataset.lang)?o.dataset.lang:"en";document.cookie="flashshare_lang="+lang+";Path=/;Max-Age=31536000;SameSite=Lax";location.reload()});document.addEventListener("click",e=>{if(e.target===langButton||langMenu.contains(e.target))return;langMenu.classList.add("hidden");langButton.setAttribute("aria-expanded","false")})}
})();
</script>
