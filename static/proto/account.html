<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>账户页终样·主题红 — 518.PLUS</title>
<style>
:root{
  --ink:#18181b; --body:#3f3f46; --muted:#a1a1aa;
  --line:#e7e5e4; --bg:#fafaf9; --card:#ffffff;
  --red:#ff4d4d; --red-hover:#ff2442; --red-soft:#fff1f2;
  --green:#16a34a; --green-soft:#f0fdf4;
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,sans-serif;
     background:var(--bg);color:var(--ink);display:flex;flex-direction:column;min-height:100dvh}

/* ── topbar ── */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top));
  background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{font-size:17px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.brand .num{color:var(--red)}
.brand .mark{width:24px;height:24px;border-radius:7px;background:var(--red);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand .mark svg{width:14px;height:14px;stroke:#fff}
.top-actions{display:flex;align-items:center;gap:16px;font-size:14px;font-weight:600}
.top-actions .mcp{color:var(--ink)}
.top-actions .navicon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card)}
.top-actions .navicon svg{width:17px;height:17px;stroke:var(--body)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#f59e0b);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff}
.lang{color:var(--body);font-weight:500;font-size:13.5px}

/* ── 页头: 余额为主角 ── */
main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:18px 16px 32px;display:flex;flex-direction:column;gap:16px}
.balance-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;
  display:flex;align-items:center;justify-content:space-between}
.balance-card .lbl{font-size:12.5px;font-weight:650;color:var(--muted);letter-spacing:.03em}
.balance-card .num{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:4px}
.balance-card .num small{font-size:14px;font-weight:600;color:var(--muted);margin-left:4px}
.claim{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 18px;
  font-size:14px;font-weight:700;color:var(--red);cursor:pointer}
.claim.done{color:var(--green);border-color:transparent;background:var(--green-soft)}

/* ── tabs: 分区导航 ── */
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.tab{flex:1;text-align:center;padding:9px 0;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.tab.on{background:var(--red);color:#fff}

/* ── 充值占位 ── */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.panel .t{font-size:14.5px;font-weight:700}
.panel .d{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.5}

/* ── 流水表 ── */
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:6px 2px 0}
.section-h .t{font-size:15px;font-weight:700}
.section-h .n{font-size:12.5px;color:var(--muted)}
.ledger{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lrow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .ic{width:34px;height:34px;border-radius:10px;background:var(--green-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lrow .ic svg{width:16px;height:16px;stroke:var(--green)}
.lrow .mid{flex:1;min-width:0}
.lrow .mid .t{font-size:14px;font-weight:600}
.lrow .mid .d{font-size:12px;color:var(--muted);margin-top:2px}
.lrow .amt{font-size:15px;font-weight:750;color:var(--green);font-variant-numeric:tabular-nums}

footer{padding:22px;text-align:center;font-size:12px;color:var(--muted);
  padding-bottom:calc(22px + env(safe-area-inset-bottom))}
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="/"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.5H11L9.5 22 19 10h-6.5z"/></svg></span><span><span class="num">518</span>.PLUS</span></a>

    <span class="avatar">S</span>

      <div class="mid"><div class="t">每日签到</div><div class="d">08-27 08:04</div></div>
      <span class="amt">+5</span>
    </div>
    <div class="lrow">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>

</main>

<footer>© 2026 518.PLUS</footer>
</body>
</html>
