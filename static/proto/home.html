<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>首页终样·豆包配色 — 518.PLUS</title>
<style>
/* ═══ vbazz.cn 主题红体系(提取自其生产CSS): 主红#ff4d4d hover#ff2442 浅红底#fff1f2 ═══
   中性灰阶: 主字#18181b 次#3f3f46 弱#a1a1aa 线#e7e5e4 底#fafaf9            */
:root{
  --ink:#18181b; --body:#3f3f46; --muted:#a1a1aa;
  --line:#e7e5e4; --bg:#fafaf9; --card:#ffffff;
  --red:#ff4d4d; --red-hover:#ff2442; --red-soft:#fff1f2;
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
     background:var(--bg);color:var(--ink);display:flex;flex-direction:column;min-height:100dvh}

/* ── topbar ── */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top));
  background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{font-size:17px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.brand .num{color:var(--red)}
.brand .mark{width:24px;height:24px;border-radius:7px;background:var(--red);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand .mark svg{width:14px;height:14px;stroke:#fff}
.top-actions{display:flex;align-items:center;gap:16px;font-size:14px;font-weight:600}
.top-actions .mcp{color:var(--ink)}
.top-actions .login{color:var(--body)}
.top-actions .register{background:var(--red);color:#fff;padding:7px 16px;border-radius:8px}
.top-actions .lang{color:var(--body);font-weight:500}

/* ── 主区 ── */
main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:20px 16px 32px;display:flex;flex-direction:column;gap:20px}

/* ① 上传卡 */
.upload-card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:0 1px 3px rgba(25,28,31,.05)}
.drop{display:flex;flex-direction:column;align-items:center;gap:10px;padding:34px 20px 26px;cursor:pointer;text-align:center}
.drop .glyph{width:52px;height:52px;border-radius:12px;background:var(--red-soft);display:flex;align-items:center;justify-content:center}
.drop .glyph svg{width:24px;height:24px;stroke:var(--red)}
.drop .t{font-size:16.5px;font-weight:700}
.drop .t em{font-style:normal;color:var(--red)}
.drop .fmt{font-size:12.5px;color:var(--muted);letter-spacing:.04em}

.card-divider{height:1px;background:var(--line)}
.controls{display:flex;align-items:stretch}
.controls .field{flex:1;padding:13px 18px;display:flex;flex-direction:column;gap:3px;cursor:pointer;position:relative}
.controls .field+.field{border-left:1px solid var(--line)}
.controls .field span{font-size:11.5px;font-weight:650;color:var(--muted);letter-spacing:.03em}
.controls .field b{font-size:15px;font-weight:650;display:flex;align-items:center;gap:6px}
.controls .field b svg{width:13px;height:13px;stroke:var(--muted)}
.controls .field select{position:absolute;inset:0;opacity:0;cursor:pointer}
.cta{margin:14px 14px 16px}
.cta button{width:100%;border:0;border-radius:10px;background:var(--red);color:#fff;font-size:16px;
  font-weight:700;padding:14px;font-family:inherit;cursor:pointer}
.cta button:active{background:var(--red-hover)}

/* ② 工具区 */
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 0}
.section-h .t{font-size:15px;font-weight:700}
.section-h .n{font-size:12.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.gtool{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;
  display:flex;align-items:center;gap:10px;cursor:pointer}
.gtool svg{width:19px;height:19px;stroke:var(--body);flex-shrink:0}
.gtool .t{font-size:14px;font-weight:600;flex:1;min-width:0}
.gtool .cost{font-size:11.5px;font-weight:700;color:var(--red);background:var(--red-soft);
  padding:2px 7px;border-radius:6px}
.gtool.on{border-color:var(--red);background:var(--red-soft)}
.gtool.on svg{stroke:var(--red)}
.gtool.on .t{color:var(--red)}

footer{padding:22px;text-align:center;font-size:12px;color:var(--muted);
  padding-bottom:calc(22px + env(safe-area-inset-bottom))}
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="/"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.5H11L9.5 22 19 10h-6.5z"/></svg></span><span><span class="num">518</span>.PLUS</span></a>
  <div class="top-actions">
    <span class="mcp">MCP</span><span class="login">登录</span><span class="register">注册</span><span class="lang">简体中文 ▾</span>
  </div>
</div>

<main>
  <div class="upload-card">
    <div class="drop">
      <div class="glyph"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 16.7A4.5 4.5 0 0017.5 8h-1.8A7 7 0 104 15.1"/><path d="M12 12v9m0-9l-3.5 3.5M12 12l3.5 3.5"/></svg></div>
      <div class="t">拖放文件或 <em>点选上传</em></div>
      <div class="fmt">图片 · 文档 · 压缩包 · 代码 · 文本 — 50MB 以内</div>
    </div>
    <div class="card-divider"></div>
    <div class="controls">
      <div class="field"><span>有效期</span><b>1 天<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg><select><option>1 天</option><option>3 天</option><option>7 天</option></select></b></div>
      <div class="field"><span>下载次数</span><b>50 次<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg><select><option>1 次</option><option>10 次</option><option>50 次</option><option>100 次</option><option>200 次</option></select></b></div>
    </div>
    <div class="cta"><button>生成分享链接</button></div>
  </div>

  <div class="section-h"><span class="t">文件处理工具</span><span class="n">9 个可用</span></div>
  <div class="grid">
    <div class="gtool"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path d="M12 3l7 4v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V7z"/></svg><span class="t">图片净化</span></div>
    <div class="gtool on"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path d="M4 6a2 2 0 012-2h12a2 2 0 012 2v12a2 2 0 01-2 2H6a2 2 0 01-2-2z"/><path d="M4 16l4-4 3 3 5-5 4 4"/></svg><span class="t">截图美化 · 极光</span></div>
    <div class="gtool"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span class="t">图片压缩</span></div>
    <div class="gtool"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/></svg><span class="t">裁白边</span></div>
    <div class="gtool"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="12" cy="12" r="4"/></svg><span class="t">ICO 图标</span></div>
    <div class="gtool"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path d="M17 3l4 4-4 4M21 7H8m-1 14l-4-4 4-4M3 17h13"/></svg><span class="t">图片转 PDF</span></div>
    <div class="gtool"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/><path d="M8 12h8"/></svg><span class="t">PDF 合并</span></div>
    <div class="gtool"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path d="M21 8v12H3V8M1 3h22v5H1zM10 12h4"/></svg><span class="t">ZIP 打包</span></div>
    <div class="gtool"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M9 15h6"/></svg><span class="t">文档转 PDF</span><span class="cost">5</span></div>
  </div>
</main>

<footer>© 2026 518.PLUS</footer>
</body>
</html>
